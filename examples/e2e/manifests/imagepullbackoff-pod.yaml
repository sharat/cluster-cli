apiVersion: v1
kind: Pod
metadata:
  name: imagepullbackoff-pod
  namespace: default
  labels:
    app: imagepullbackoff-test
spec:
  containers:
  - name: missing-image
    image: nonexistent/image:does-not-exist
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 20m
        memory: 32Mi
