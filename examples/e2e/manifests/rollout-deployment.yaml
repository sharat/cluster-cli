apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-app
  namespace: default
  labels:
    app: rollout-test
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rollout-test
  template:
    metadata:
      labels:
        app: rollout-test
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        ports:
        - containerPort: 80
