apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  namespace: default
  labels:
    app: job-test
spec:
  template:
    metadata:
      labels:
        app: job-test
    spec:
      containers:
      - name: job-runner
        image: busybox:1.37
        command: ["sh", "-c", "echo 'Job running...'; sleep 5; echo 'Job complete!'"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 20m
            memory: 32Mi
      restartPolicy: Never
  backoffLimit: 2
