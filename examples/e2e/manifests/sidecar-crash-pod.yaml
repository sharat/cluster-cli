apiVersion: v1
kind: Pod
metadata:
  name: sidecar-crash-pod
  namespace: default
  labels:
    app: sidecar-crash-test
spec:
  initContainers:
  # Native sidecar (restartPolicy: Always): starts, runs alongside the app,
  # then keeps crashing so it reaches CrashLoopBackOff while the app runs.
  - name: proxy
    image: busybox:1.37
    restartPolicy: Always
    command: ["sh", "-c", "echo 'proxy up'; sleep 5; echo 'proxy crashed'; exit 1"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 20m
        memory: 32Mi
  containers:
  - name: app
    image: busybox:1.37
    command: ["sh", "-c", "echo 'app running'; sleep 3600"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 20m
        memory: 32Mi
