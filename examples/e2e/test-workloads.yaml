---
# Healthy deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthy
  template:
    metadata:
      labels:
        app: healthy
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
# Crash-looping pod
apiVersion: v1
kind: Pod
metadata:
  name: crash-loop
  namespace: default
spec:
  containers:
  - name: crash
    image: busybox
    command: ["sh", "-c", "exit 1"]
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
      limits:
        memory: "64Mi"
        cpu: "100m"
---
# OOMKilled pod
apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: default
spec:
  containers:
  - name: memory-hog
    image: polinux/stress
    command: ["stress", "--vm", "1", "--vm-bytes", "150M"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
---
# Image pull failure
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
  namespace: default
spec:
  containers:
  - name: app
    image: nonexistent/image:invalid
    resources:
      requests:
        memory: "32Mi"
        cpu: "50m"
---
# Pending pod (insufficient resources)
apiVersion: v1
kind: Pod
metadata:
  name: pending-pod
  namespace: default
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests:
        memory: "1Ti"
        cpu: "100"
