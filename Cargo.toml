[workspace]
members = [".", "crates/cluster-core", "crates/cluster-desktop"]
# `cargo build` / `cargo test` at the root cover the TUI and core only; the
# GPUI desktop app is opt-in (`cargo run -p cluster-desktop`) so CI and
# release builds don't pull in its GPU/windowing dependencies.
default-members = [".", "crates/cluster-core"]
resolver = "2"

[workspace.package]
version = "0.3.5"
edition = "2024"
authors = ["Sarath C"]
license = "MIT"
repository = "https://github.com/sharat/cluster-cli"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
toml = "1.1"
tracing = "0.1"

[package]
name = "cluster-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A fast, interactive terminal UI for monitoring Kubernetes cluster health"
readme = "README.md"
license = "MIT"
repository = "https://github.com/sharat/cluster-cli"
homepage = "https://github.com/sharat/cluster-cli"
keywords = ["kubernetes", "k8s", "monitoring", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
rust-version.workspace = true

[[bin]]
name = "cluster"
path = "src/main.rs"

[dependencies]
cluster-core = { path = "crates/cluster-core" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

tokio = { version = "1", features = ["full"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"

clap = { version = "4", features = ["derive"] }
dirs = "7"
toml = "1.1"

reqwest = { version = "0.13", features = ["json"] }
semver = "1"
sha2 = "0.11"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# xattr 0.2.3 (pulled by gpui's zed-async-tar) is incompatible with libc ≥0.2.186
# because it tries to use ENOATTR which doesn't exist on Linux (should be ENODATA).
# Patch with local fixed version.
xattr = { path = ".cargo-patches/xattr-0.2.3" }
